stages:
  extract:
    cmd: python -m legalrag.extract
    deps:
    - data/egyptian_civil_code.pdf
    - src/legalrag/arabic.py
    - src/legalrag/extract.py
    outs:
    - data/processed/civil_code.json
    - reports/extraction_report.json:
        cache: false
  validate:
    cmd: python -m legalrag.validate
    deps:
    - data/processed/civil_code.json
    - src/legalrag/validate.py
  index:
    cmd: python scripts/build_index.py
    deps:
    - data/processed/civil_code.json
    - scripts/build_index.py
    - src/legalrag/chunking.py
    - src/legalrag/embeddings.py
    params:
    - index.chunk_size
    - index.overlap
    outs:
    - data/chroma_index
