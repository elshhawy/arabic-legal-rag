[project]
name = "legalrag"
version = "0.1.0"
requires-python = ">= 3.10 "
dependencies = ["pdfplumber"]


[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

